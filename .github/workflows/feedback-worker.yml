name: Feedback Worker (Cloudflare)
# Tests the Worker in feedback-worker/ and deploys it with its D1 database (created on the first run).
# Needs the repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID; without them only the tests run.
# Run it manually with "Copy the rows from Supabase" ticked to copy the Supabase rows into D1
# (needs the secret SUPABASE_SECRET_KEY; rows already in D1 are kept, so it can be repeated).
on:
  push:
    branches: [main]
    paths: ['feedback-worker/**', '.github/workflows/feedback-worker.yml']
  workflow_dispatch:
    inputs:
      import_supabase:
        description: Copy the rows from Supabase into D1 (rows already in D1 are kept)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: feedback-worker
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: feedback-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: feedback-worker/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Cloudflare secrets missing
        if: env.HAS_CLOUDFLARE != 'true'
        run: echo "::notice::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set; tests only, nothing deployed."
      - name: Find or create the D1 database
        if: env.HAS_CLOUDFLARE == 'true'
        run: |
          find_id() {
            npx wrangler d1 list --json | node -e '
              const t = require("fs").readFileSync(0, "utf8");
              const db = JSON.parse(t.slice(t.indexOf("["))).find(d => d.name === "puzzle-feedback");
              process.stdout.write(db ? db.uuid : "");'
          }
          id=$(find_id)
          if [ -z "$id" ]; then
            npx wrangler d1 create puzzle-feedback --location enam
            id=$(find_id)
          fi
          [ -n "$id" ] || { echo "::error::D1 database puzzle-feedback not found"; exit 1; }
          sed -i "s/^database_id = .*/database_id = \"$id\"/" wrangler.toml
          echo "D1 database puzzle-feedback: $id"
      - name: Apply database migrations
        if: env.HAS_CLOUDFLARE == 'true'
        run: npx wrangler d1 migrations apply puzzle-feedback --remote
      - name: Deploy
        if: env.HAS_CLOUDFLARE == 'true'
        run: npx wrangler deploy --message "${GITHUB_SHA::7}"
      - name: Copy the rows from Supabase
        if: env.HAS_CLOUDFLARE == 'true' && inputs.import_supabase
        env:
          SUPABASE_URL: https://gevbctklqelyumhynfnq.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          # import.sql holds visitor remarks: keep it out of the log and the repository.
          node tools/import_supabase.js --from-supabase > "$RUNNER_TEMP/import.sql"
          npx wrangler d1 execute puzzle-feedback --remote --yes --file "$RUNNER_TEMP/import.sql" > /dev/null
          rm -f "$RUNNER_TEMP/import.sql"
          echo "Rows in D1 after the copy:"
          npx wrangler d1 execute puzzle-feedback --remote --json --command \
            "SELECT 'results' t, site, count(*) n FROM results GROUP BY site UNION ALL SELECT 'ratings', site, count(*) FROM ratings GROUP BY site UNION ALL SELECT 'difficulty_answers', site, count(*) FROM difficulty_answers GROUP BY site" \
            | node -e 'const t = require("fs").readFileSync(0, "utf8"); for (const r of JSON.parse(t.slice(t.indexOf("[")))[0].results) console.log(`${r.t} ${r.site}: ${r.n}`);'
