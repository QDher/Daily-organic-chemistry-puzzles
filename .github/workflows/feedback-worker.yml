name: Feedback Worker (Cloudflare)
# Tests the Worker in feedback-worker/ and deploys it with its D1 database (created on the first run).
# Needs the repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID; without them only the tests run.
# Optional secret MECH_EXPORT_KEY: key of the export of the curly-arrow entries (feedback-worker/README.md).
# It can also be run manually (Actions → Feedback Worker (Cloudflare) → Run workflow).
on:
  push:
    branches: [main]
    paths: ['feedback-worker/**', '.github/workflows/feedback-worker.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: feedback-worker
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: feedback-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
      MECH_EXPORT_KEY: ${{ secrets.MECH_EXPORT_KEY }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: feedback-worker/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Cloudflare secrets missing
        if: env.HAS_CLOUDFLARE != 'true'
        run: echo "::notice::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set; tests only, nothing deployed."
      - name: Find or create the D1 database
        if: env.HAS_CLOUDFLARE == 'true'
        run: |
          find_id() {
            npx wrangler d1 list --json | node -e '
              const t = require("fs").readFileSync(0, "utf8");
              const db = JSON.parse(t.slice(t.indexOf("["))).find(d => d.name === "puzzle-feedback");
              process.stdout.write(db ? db.uuid : "");'
          }
          id=$(find_id)
          if [ -z "$id" ]; then
            npx wrangler d1 create puzzle-feedback --location enam
            id=$(find_id)
          fi
          [ -n "$id" ] || { echo "::error::D1 database puzzle-feedback not found"; exit 1; }
          sed -i "s/^database_id = .*/database_id = \"$id\"/" wrangler.toml
          echo "D1 database puzzle-feedback: $id"
      - name: Apply database migrations
        if: env.HAS_CLOUDFLARE == 'true'
        run: npx wrangler d1 migrations apply puzzle-feedback --remote
      - name: Deploy
        if: env.HAS_CLOUDFLARE == 'true'
        run: npx wrangler deploy --message "${GITHUB_SHA::7}"
      - name: Set the export key of the curly-arrow entries
        # Optional repository secret MECH_EXPORT_KEY: without it /rpc/mech_export stays closed (403).
        if: env.HAS_CLOUDFLARE == 'true' && env.MECH_EXPORT_KEY != ''
        run: printf '%s' "$MECH_EXPORT_KEY" | npx wrangler secret put MECH_EXPORT_KEY
