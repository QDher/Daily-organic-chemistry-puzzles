# Cloudflare Worker for the shared results, ratings and difficulty answers (see README.md).
name = "puzzle-feedback"
main = "src/index.js"
compatibility_date = "2026-10-23"
workers_dev = true

[vars]
# Pages allowed to call the Worker from a browser (comma-separated). Both sites are on this origin.
ALLOWED_ORIGINS = "https://qdher.github.io"
# Tester labels accepted by POST /mech_entries for site "mechpilot": first 8 hex digits of the SHA-256 of each tester
# code (data/testers.json of QDher/Daily_Curly_Chem). Not secret.
MECH_TESTERS = "bad7de23,f84b5443,defa5566,a8ab329b,27246f6e,c9dc4bd2"

[[d1_databases]]
binding = "DB"
database_name = "puzzle-feedback"
# Printed by `npx wrangler d1 create puzzle-feedback`.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
